<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - Suhayl Patel</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --ink: #1c1c1e;
      --muted: #6b6b70;
      --line: rgba(0, 0, 0, 0.06);
      --glass: rgba(255, 255, 255, 0.55);
      --glass-strong: rgba(255, 255, 255, 0.75);
      --accent: #0a84ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      background-image:
        radial-gradient(1200px 600px at 10% -10%, #d9e8ff 0%, transparent 60%),
        radial-gradient(900px 500px at 110% 20%, #ffe6f0 0%, transparent 55%),
        radial-gradient(800px 600px at 50% 110%, #e7fff1 0%, transparent 60%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      padding-top: 80px;
    }

    nav {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      width: min(832px, calc(100% - 48px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: var(--glass);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
    }

    nav .brand {
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 4px;
    }

    nav a {
      color: var(--ink);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 14px;
      transition: background 0.2s;
      position: relative;
      white-space: nowrap;
    }

    nav a:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    nav a.active {
      background: rgba(0, 0, 0, 0.08);
    }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink);
      padding: 4px 6px;
      font-size: 20px;
      line-height: 1;
    }

    @media (max-width: 600px) {
      nav {
        border-radius: 22px;
        flex-wrap: wrap;
        padding: 10px 16px;
      }

      .nav-toggle {
        display: block;
      }

      nav ul {
        display: none;
        width: 100%;
        flex-direction: column;
        gap: 2px;
        padding: 8px 0 4px;
      }

      nav ul.open {
        display: flex;
      }

      nav ul li {
        width: 100%;
      }

      nav a {
        display: block;
        border-radius: 12px;
        padding: 9px 12px;
      }
    }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 24px 96px;
    }

    section {
      margin-bottom: 56px;
      scroll-margin-top: 96px;
    }

    .card {
      background: var(--glass-strong);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.06);
    }

    .hero {
      padding: 40px 32px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
    }

    @media (max-width: 640px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 28px 20px;
      }

      .hero .avatar-wrap {
        order: -1;
        justify-self: center;
      }

      .hero p {
        max-width: 100%;
      }
    }

    .hero h1 {
      font-size: clamp(28px, 5.5vw, 52px);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 14px;
    }

    .hero p {
      color: var(--muted);
      font-size: 17px;
      max-width: 48ch;
    }

    .avatar-wrap {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 640px) {
      .avatar-wrap {
        width: 140px;
        height: 140px;
      }
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 14px;
      padding-left: 4px;
    }

    .exp-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 4px;
      border-bottom: 1px solid var(--line);
    }

    .exp-item:last-child {
      border-bottom: none;
    }

    .exp-item h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .exp-item .role {
      color: var(--muted);
      font-size: 14px;
    }

    .exp-item .date {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      margin-left: auto;
    }

    .exp-item .body {
      flex: 1;
      min-width: 0;
    }

    .exp-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #eef2f7, #ffffff);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
      overflow: hidden;
    }

    .exp-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @media (max-width: 480px) {
      .exp-item {
        flex-wrap: wrap;
      }

      .exp-item .date {
        width: 100%;
        margin-left: 60px;
        margin-top: -10px;
        padding-bottom: 4px;
      }
    }

    .carousel-wrap {
      position: relative;
    }

    .carousel {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 4px 4px 20px;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .proj {
      flex: 0 0 280px;
      scroll-snap-align: start;
      background: var(--glass-strong);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(31, 38, 135, 0.05);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      text-decoration: none;
      color: var(--ink);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 480px) {
      .proj {
        flex: 0 0 calc(100vw - 72px);
      }
    }

    .proj:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(31, 38, 135, 0.12);
    }

    .proj-img {
      width: 100%;
      aspect-ratio: 16/10;
      background: linear-gradient(135deg, #d9e8ff, #ffe6f0);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(0, 0, 0, 0.25);
      font-size: 12px;
    }

    .proj-body {
      padding: 16px 18px 18px;
    }

    .proj h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .proj p {
      color: var(--muted);
      font-size: 13px;
    }

    .proj .tags {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(10, 132, 255, 0.08);
      color: var(--accent);
      border-radius: 6px;
    }

    .car-btn {
      position: absolute;
      top: 50%;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--glass-strong);
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      cursor: pointer;
      font-size: 18px;
      color: var(--ink);
      box-shadow: 0 4px 14px rgba(31, 38, 135, 0.12);
      transition: transform 0.15s, background 0.15s;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-50%);
    }

    .car-prev { left: -24px; }
    .car-next { right: -24px; }

    @media (max-width: 900px) {
      .car-prev { left: -8px; }
      .car-next { right: -8px; }
    }

    .car-btn:hover {
      transform: translateY(-50%) scale(1.05);
      background: rgba(255, 255, 255, 0.95);
    }

    .car-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    @media (max-width: 600px) {
      .car-btn { display: none; }
    }

    .tutor-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    @media (max-width: 480px) {
      .tutor-card {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    .tutor-card p {
      color: var(--muted);
      font-size: 14px;
      max-width: 50ch;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      background: var(--ink);
      color: white;
      border-radius: 999px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .contact-row a {
      color: var(--ink);
      text-decoration: none;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      font-size: 14px;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .contact-icon {
      display: inline-flex;
      align-items: center;
      color: var(--muted);
    }

    .contact-row a:hover {
      background: rgba(255, 255, 255, 0.9);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 64px;
    }
  </style>
</head>

<body>

  <nav>
    <span class="brand">Suhayl Patel</span>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#education">Experience</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#tutoring">Tutoring</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <main>
    <section id="home" class="card hero">
      <div id="hero" style="display:contents;"></div>
    </section>

    <section id="education">
      <h2>Education</h2>
      <div class="card" id="education-list"></div>
    </section>

    <section id="experience-work">
      <h2>Work</h2>
      <div class="card" id="experience-list"></div>
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <div class="carousel-wrap">
        <button class="car-btn car-prev" id="car-prev" aria-label="Previous">‹</button>
        <div class="carousel" id="carousel"></div>
        <button class="car-btn car-next" id="car-next" aria-label="Next">›</button>
      </div>
    </section>

    <section id="tutoring">
      <h2>Tutoring</h2>
      <div class="card tutor-card" id="tutoring-card"></div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <div class="card" id="contact-card"></div>
    </section>

    <footer>© 2026 Suhayl Patel</footer>
  </main>

  <script>
    const sections = document.querySelectorAll('section[id]');
    const navLinks = document.querySelectorAll('nav a[href^="#"]');
    const OFFSET = 120;

    function updateActive() {
      const scrollY = window.scrollY;
      let activeId = null;
      sections.forEach(section => {
        if (section.offsetTop <= scrollY + OFFSET) {
          activeId = section.id;
        }
      });
      navLinks.forEach(link => {
        link.classList.toggle('active', link.getAttribute('href').slice(1) === activeId);
      });
    }

    window.addEventListener('scroll', updateActive, { passive: true });
    updateActive();
  </script>
  <script type="module" src="./app.js"></script>
</body>

</html>
